<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="60%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="300" fill="#0e7490" opacity="0.28"/>
  <circle cx="1080" cy="540" r="320" fill="#5b21b6" opacity="0.26"/>
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
